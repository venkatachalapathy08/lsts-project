<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raise Complaint</title>
    <script>
        const token = localStorage.getItem("token");
        const role = localStorage.getItem("role");

        if (!token || role !== "USER") {
            alert("Access denied");
            window.location.href = "login.html";
        }

        function logout() {
            localStorage.removeItem("token");
            localStorage.removeItem("role");
            window.location.href = "login.html";
        }
    </script>

</head>
<body>
<h1>Raise Complaint</h1>

<form id="complaintForm">
    <label><input type="text" id="title" placeholder="Complaint Title" required></label><br><br>
    <label><textarea id="description" placeholder="Complaint Description" required></textarea></label><br><br>
    <button type="submit">Submit Complaint</button>
</form>

<button onclick="logout()">Logout</button>

<script>
    document.getElementById("complaintForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const title = document.getElementById("title").value.trim();
        const description = document.getElementById("description").value.trim();

        try {
            const response = await fetch("http://localhost:8080/api/complaints", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token
                },
                body: JSON.stringify({
                    title: title,
                    description: description
                })
            });

            const result = await response.text();
            console.log("Response:", result);

            if (!response.ok) {
                throw new Error(result || "Failed to create complaint");
            }

            alert("Complaint created successfully");

            document.getElementById("complaintForm").reset();

        } catch (error) {
            console.error("Complaint error:", error);
            alert("Failed to create complaint: " + error.message);
        }
    });
</script>
</body>
</html>
